name: plana
description: "Plana — برنامه‌ریز روزانه و هفتگی با طراحی Liquid Glass"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Local Package ──
  liquid_glass_easy:
    path: ./packages/liquid_glass_easy

  # ── Database ──
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2

  # ── UI ──
  mesh_gradient: ^1.3.8
  smooth_corner: ^1.0.0
  intl: ^0.19.0

  # ── Storage ──
  shared_preferences: ^2.3.2

  # ── File ──
  file_picker: ^8.1.2

  # ── Audio (اگر بعداً موزیک پلیر خواستی) ──
  # just_audio: ^0.9.46
  # just_audio_media_kit: ^2.0.5
  # media_kit_libs_linux: ^1.1.3
  # media_kit_libs_windows_audio: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # 💥 شیدرهای Liquid Glass (حیاتی!)
  shaders:
    - packages/liquid_glass_easy/lib/assets/shaders/liquid_glass.frag
    - packages/liquid_glass_easy/lib/assets/shaders/liquid_glass_skia.frag
    - packages/liquid_glass_easy/lib/assets/shaders/liquid_glass_border.frag
    - packages/liquid_glass_easy/lib/assets/shaders/liquid_glass_border_skia.frag
    - packages/liquid_glass_easy/lib/assets/shaders/metaball_glass.frag
    - packages/liquid_glass_easy/lib/assets/shaders/metaball_glass_skia.frag
    - packages/liquid_glass_easy/lib/assets/shaders/liquid_glass_desktop.frag
    - packages/liquid_glass_easy/lib/assets/shaders/metaball_glass_desktop.frag
